services:
  ollama:
    image: ollama/ollama:0.32.4-rocm
    restart: unless-stopped

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "5m"

    expose:
      - "11434"

    volumes:
      - ollama-data:/root/.ollama

  activepieces:
    image: ghcr.io/activepieces/activepieces:0.90.2
    restart: unless-stopped

    depends_on:
      - postgres
      - redis

    env_file:
      - .env

    environment:
      AP_CONTAINER_TYPE: APP

    ports:
      - "8080:80"

    volumes:
      - activepieces-cache:/usr/src/app/cache

  activepieces-worker:
    image: ghcr.io/activepieces/activepieces:0.90.2
    restart: unless-stopped

    depends_on:
      - activepieces

    env_file:
      - .env

    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_FRONTEND_URL: http://activepieces

    volumes:
      - activepieces-cache:/usr/src/app/cache

  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.0.7
    restart: unless-stopped

    volumes:
      - redis-data:/data

volumes:
  ollama-data:
  activepieces-cache:
  postgres-data:
  redis-data:
